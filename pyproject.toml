[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-demand-service"
version = "0.1.0"
description = "Reproducible synthetic energy forecasting with monitored model lifecycle"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy==2.3.5", "pandas==2.2.3", "scikit-learn==1.8.0", "scipy==1.17.0",
  "mlflow-skinny==2.22.0", "fastapi==0.115.12", "pydantic==2.13.5",
  "uvicorn==0.34.2", "httpx==0.28.1", "prometheus-client==0.21.1",
  "PyYAML==6.0.3", "joblib==1.5.3",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "ruff==0.11.8"]
server = ["Flask==3.1.0", "gunicorn==23.0.0"]

[project.scripts]
energy = "energy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:.*Type hint.*:UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
