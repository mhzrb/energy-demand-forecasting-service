name: quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      GRAFANA_ADMIN_PASSWORD: ci-only-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - run: energy train --output /tmp/evidence
      - run: energy demo --output /tmp/evidence
      - run: python scripts/smoke_api.py --output /tmp/evidence/api_smoke.json
      - run: docker compose config --quiet
      - run: docker build -t energy-demand:ci .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: execution-evidence
          path: /tmp/evidence
